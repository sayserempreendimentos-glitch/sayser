<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GES - Grupo Empresarial Sayser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #000000; color: #ffffff; padding: 12px; display: flex; justify-content: center; }
        .mobile-container { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; }
        .header { text-align: center; padding: 6px 0; border-bottom: 1px solid #161616; }
        .logo-main { color: #ffcc00; font-size: 22px; font-weight: bold; letter-spacing: 1px; }
        .subtitle { color: #888; font-size: 11px; margin-top: 2px; }
        
        .categories-menu { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
        .categories-menu::-webkit-scrollbar { display: none; }
        .tab-btn { background: #0a0a0a; color: #777; border: 1px solid #161616; padding: 8px 16px; border-radius: 16px; white-space: nowrap; font-size: 12px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #ffcc00; color: #000; border-color: #ffcc00; }
        .tab-btn.contract-tab { border-color: #00ff66; color: #00ff66; }
        .tab-btn.contract-tab.active { background: #00ff66; color: #000; }
        
        .products-container { min-height: 240px; margin-top: 4px; display: block; }
        .product-card { background: #0a0a0a; border: 1px solid #161616; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .img-box { width: 100%; height: 140px; background: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-box img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .product-title { font-size: 15px; font-weight: bold; color: #fff; }
        .product-desc { font-size: 12px; color: #777; line-height: 1.3; }
        
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid #161616; border-bottom: 1px solid #161616; }
        .price-block { display: flex; flex-direction: column; gap: 1px; }
        .label { font-size: 8px; color: #444; text-transform: uppercase; font-weight: bold; }
        .val-main { font-size: 16px; font-weight: bold; color: #ffcc00; }
        .val-calc { font-size: 14px; font-weight: bold; color: #00ff66; }
        
        .btn-add { background: #ffcc00; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; width: 100%; text-align: center; }
        .btn-delete-prod { background: #ff3333; color: white; border: none; padding: 4px 8px; font-size: 10px; border-radius: 4px; position: absolute; top: 8px; right: 8px; cursor: pointer; font-weight: bold; }
        
        .contract-card { background: #0a0a0a; border: 1px solid #161616; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .terms-box { background: #000; border: 1px solid #222; border-radius: 6px; padding: 8px; max-height: 100px; overflow-y: auto; font-size: 11px; color: #888; }
        .checkbox-row { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #ccc; }
        
        .cart-section { background: #050505; border: 1px dashed #222; border-radius: 12px; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        .cart-title { font-size: 12px; font-weight: bold; color: #ffcc00; padding-bottom: 4px; border-bottom: 1px solid #161616; }
        .cart-item { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; }
        .cart-totals { display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; border-top: 1px solid #161616; padding-top: 6px; }
        
        .admin-panel { background: #111111; border: 2px solid #ffcc00; border-radius: 12px; padding: 12px; margin-top: 25px; display: flex; flex-direction: column; gap: 8px; }
        .admin-title { font-size: 12px; font-weight: bold; color: #ffcc00; text-align: center; text-transform: uppercase; }
        .admin-input, .admin-select { width: 100%; background: #000; border: 1px solid #333; color: #fff; padding: 8px; border-radius: 6px; font-size: 12px; }
        .btn-save-new { background: #ffcc00; color: #000; border: none; padding: 11px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header">
            <div class="logo-main">GES</div>
            <div class="subtitle">Grupo Empresarial Sayser</div>
        </div>
        <div class="categories-menu">
            <button class="tab-btn active" onclick="switchTab(event, 'cosmeticos')">Cosméticos</button>
            <button class="tab-btn" onclick="switchTab(event, 'alimento')">Alimento</button>
            <button class="tab-btn" onclick="switchTab(event, 'hidraulico')">Hidráulico</button>
            <button class="tab-btn" onclick="switchTab(event, 'eletrons')">Elétrons</button>
            <button class="tab-btn" onclick="switchTab(event, 'eletronico')">Eletrônico</button>
            <button class="tab-btn" onclick="switchTab(event, 'construcao')">Material de Construção</button>
            <button class="tab-btn" onclick="switchTab(event, 'bairroquiz')">Bairro Quiz</button>
            <button class="tab-btn" onclick="switchTab(event, 'eletricas')">Elétricas</button>
            <button class="tab-btn contract-tab" onclick="switchTab(event, 'contrato')">📜 Contrato & Cadastro</button>
        </div>
        <div class="products-container" id="productDisplayArea"></div>
        <div id="contractArea" style="display: none;">
            <div class="contract-card">
                <div class="product-title" style="color: #00ff66;">Termos e Contrato GES</div>
                <div class="terms-box">
                    <strong>REGULAMENTO ADMINISTRATIVO SAYSER</strong><br><br>
                    Os bônus de indicação serão conferidos mediante faturamento final enviado por e-mail.
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="agreeTerms">
                    <label for="agreeTerms" style="margin-left:6px;">Declaro que li e aceito as condições.</label>
                </div>
            </div>
        </div>
        <div class="cart-section">
            <div class="cart-title">🛒 Conferência do Pedido:</div>
            <div id="cartItemsList"><p style="font-size: 11px; color: #444; text-align: center;">Carrinho vazio.</p></div>
            <div class="cart-totals">
                <span>Produtos: <span id="totalPrice" style="color:#ffcc00;">R$ 0,00</span></span>
                <span>Bônus: <span id="totalBonus" style="color:#00ff66;">R$ 0,00</span></span>
            </div>
            <button class="btn-email" onclick="sendOrderEmail()">📩 Confirmar e Enviar por E-mail</button>
        </div>
        <div class="admin-panel">
            <div class="admin-title">⚙️ Área do Dono (Cadastro)</div>
            <select id="newProdCat" class="admin-select">
                <option value="cosmeticos">Cosméticos</option>
                <option value="alimento">Alimento</option>
                <option value="hidraulico">Hidráulico</option>
                <option value="eletrons">Elétrons</option>
                <option value="eletronico">Eletrônico</option>
                <option value="construcao">Material de Construção</option>
                <option value="bairroquiz">Bairro Quiz</option>
                <option value="eletricas">Elétricas</option>
            </select>
            <input type="text" id="newProdName" class="admin-input" placeholder="Nome do Produto">
            <input type="text" id="newProdDesc" class="admin-input" placeholder="Descrição curta">
            <input type="number" id="newProdPrice" class="admin-input" placeholder="Preço (Ex: 150.00)">
            <input type="number" id="newProdPercent" class="admin-input" placeholder="Porcentagem de Recompensa (Ex: 10)">
            <input type="text" id="newProdImg" class="admin-input" placeholder="Link da Imagem (URL)">
            <button class="btn-save-new" onclick="addCustomProduct()">➕ Gravar Produto no Site</button>
        </div>
    </div>
    <script>

            alimento: { name: "Cesta de Alimentos Premium", desc: "Mantimentos essenciais direto do produtor.", price: 150.00, bonus: 22.50, img: "https://unsplash.com" },
            hidraulico: { name: "Torneira Luxo Inox", desc: "Material inoxidável com vedação de alta durabilidade.", price: 120.00, bonus: 18.00, img: "https://unsplash.com" },
            eletrons: { name: "Kit Componentes Elétrons", desc: "Placas e conectores para pequenos circuitos.", price: 75.00, bonus: 11.25, img: "https://unsplash.com" },
            eletronico: { name: "DRONE V88 CÂMERA HD", desc: "Giroscópio embutido e transmissão de imagens ao vivo.", price: 180.00, bonus: 27.00, img: "https://unsplash.com" },
            construcao: { name: "Argamassa Interna AC1", desc: "Rendimento ideal para pisos cerâmicos.", price: 28.00, bonus: 4.20, img: "https://unsplash.com" },
