<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GES - Editor</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#111;
 color:#fff;
 font-family:Arial,sans-serif;
 padding:12px
}
#login,#painel{
 max-width:520px;
 margin:auto
}
h1{
 text-align:center;
 font-size:24px;
 margin:8px 0 2px
}
h2{
 text-align:center;
 font-size:15px;
 color:#bbb;
 margin:0 0 15px
}
input,select,textarea{
 width:100%;
 padding:9px;
 margin:4px 0 9px;
 background:#222;
 color:#fff;
 border:1px solid #444;
 border-radius:5px
}
textarea{height:60px}
label{
 display:block;
 font-size:13px;
 font-weight:bold;
 margin-top:5px
}
button{
 border:0;
 border-radius:5px;
 padding:9px 12px;
 margin:3px;
 font-weight:bold;
 cursor:pointer
}
.entrar,.salvar{background:#19c37d;color:#000}
.limpar{background:#555;color:#fff}
.editar{background:#e5a500;color:#000}
.excluir{background:#d33;color:#fff}
.sair{background:#555;color:#fff;float:right}
.caixa{
 background:#1b1b1b;
 padding:12px;
 border-radius:8px;
 margin-top:12px
}
.item{
 border:1px solid #444;
 border-radius:6px;
 padding:9px;
 margin:8px 0
}
.item img{
 width:80px;
 height:60px;
 object-fit:contain;
 background:#222;
 display:block;
 margin-bottom:6px;
 border-radius:4px
}
.preview{
 max-width:120px;
 max-height:90px;
 display:none;
 margin:5px 0 8px;
 border-radius:5px
}
.oculto{display:none}
.file{
 background:#222;
 border:1px solid #444;
 padding:8px;
 width:100%;
 border-radius:5px;
 color:#fff
}
</style>
</head>

<body>

<div id="login">

<h1>GES</h1>
<h2>GERENCIAMENTO</h2>

<div class="caixa">

<label>E-mail</label>
<input id="email" type="email">

<label>Senha</label>
<input id="senha" type="password">

<button class="entrar" onclick="entrar()">ENTRAR</button>

</div>

</div>


<div id="painel" class="oculto">

<button class="sair" onclick="sair()">SAIR</button>

<h1>GES</h1>
<h2>EDITOR DE PRODUTOS</h2>

<div class="caixa">

<label>Categoria</label>
<select id="categoria">
<option value="cosmeticos">Cosméticos</option>
<option value="alimento">Alimento</option>
<option value="hidraulico">Hidráulico</option>
<option value="eletrons">Elétrons</option>
<option value="eletronico">Eletrônico</option>
<option value="construcao">Construção</option>
<option value="bairroquiz">Bairro Quiz</option>
<option value="eletricas">Elétricas</option>
</select>

<label>Produto</label>
<input id="nome">

<label>Descrição</label>
<textarea id="descricao"></textarea>

<label>Preço</label>
<input id="preco" type="number" step="0.01">

<label>Bônus (%)</label>
<input id="bonus" type="number" step="0.01">

<label>Imagem do computador</label>
<input
 id="arquivo"
 class="file"
 type="file"
 accept="image/*"
 onchange="carregarImagem(event)"
>

<img id="preview" class="preview">

<button class="salvar" onclick="salvarProduto()">SALVAR</button>
<button class="limpar" onclick="limpar()">LIMPAR</button>

</div>


<div class="caixa">

<h2>PRODUTOS</h2>

<div id="lista"></div>

</div>

</div>


<script>

const defaults={
cosmeticos:[{nome:"Perfume Premium GES",descricao:"",preco:150,bonus:10,imagem:""}],
alimento:[{nome:"Cesta de Alimentos Premium",descricao:"",preco:150,bonus:15,imagem:""}],
hidraulico:[{nome:"Torneira Luxo Inox",descricao:"",preco:120,bonus:15,imagem:""}],
eletrons:[{nome:"Kit Componentes Elétrons",descricao:"",preco:75,bonus:15,imagem:""}],
eletronico:[{nome:"DRONE V88 CÂMERA HD",descricao:"",preco:180,bonus:15,imagem:""}],
construcao:[{nome:"Argamassa Interna AC1",descricao:"",preco:28,bonus:15,imagem:""}],
bairroquiz:[{nome:"Produto Bairro Quiz",descricao:"",preco:50,bonus:10,imagem:""}],
eletricas:[{nome:"Produto Elétrico",descricao:"",preco:80,bonus:10,imagem:""}]
};

let produtos=
JSON.parse(localStorage.getItem("SAYSER_GES_PRODUCTS")) || defaults;

let editando=null;
let imagemAtual="";


function salvarBanco(){
 localStorage.setItem(
  "SAYSER_GES_PRODUCTS",
  JSON.stringify(produtos)
 );
}


function entrar(){

if(
 document.getElementById("email").value==="admin@sayser.com" &&
 document.getElementById("senha").value==="123456"
){
 document.getElementById("login").classList.add("oculto");
 document.getElementById("painel").classList.remove("oculto");
 mostrarProdutos();
}else{
 alert("E-mail ou senha incorretos.");
}

}


function sair(){
 document.getElementById("painel").classList.add("oculto");
 document.getElementById("login").classList.remove("oculto");
}


function carregarImagem(event){

const arquivo=event.target.files[0];

if(!arquivo)return;

const leitor=new FileReader();

leitor.onload=function(e){

imagemAtual=e.target.result;

const preview=document.getElementById("preview");

preview.src=imagemAtual;
preview.style.display="block";

};

leitor.readAsDataURL(arquivo);

}


function salvarProduto(){

const categoria=document.getElementById("categoria").value;

const produto={
 nome:document.getElementById("nome").value.trim(),
 descricao:document.getElementById("descricao").value.trim(),
 preco:parseFloat(document.getElementById("preco").value)||0,
 bonus:parseFloat(document.getElementById("bonus").value)||0,
 imagem:imagemAtual
};

if(!produto.nome){
 alert("Digite o nome do produto.");
 return;
}

if(editando!==null){

produtos[editando.categoria][editando.index]=produto;

}else{

if(!produtos[categoria])produtos[categoria]=[];

produtos[categoria].push(produto);

}

salvarBanco();

limpar();

mostrarProdutos();

alert("Produto salvo.");

}


function editarProduto(categoria,index){

const p=produtos[categoria][index];

document.getElementById("categoria").value=categoria;
document.getElementById("nome").value=p.nome||"";
document.getElementById("descricao").value=p.descricao||"";
document.getElementById("preco").value=p.preco||"";
document.getElementById("bonus").value=p.bonus||"";

imagemAtual=p.imagem||"";

const preview=document.getElementById("preview");

if(imagemAtual){
 preview.src=imagemAtual;
 preview.style.display="block";
}else{
 preview.style.display="none";
}

editando={
 categoria:categoria,
 index:index
};

window.scrollTo(0,0);

}


function excluirProduto(categoria,index){

if(confirm("Excluir este produto?")){

produtos[categoria].splice(index,1);

salvarBanco();

mostrarProdutos();

}

}


function limpar(){

document.getElementById("nome").value="";
document.getElementById("descricao").value="";
document.getElementById("preco").value="";
document.getElementById("bonus").value="";
document.getElementById("arquivo").value="";

document.getElementById("preview").style.display="none";

imagemAtual="";
editando=null;

}


function mostrarProdutos(){

const lista=document.getElementById("lista");

lista.innerHTML="";

Object.keys(produtos).forEach(categoria=>{

produtos[categoria].forEach((p,index)=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=`

${p.imagem?
`<img src="${p.imagem}">`
:""}

<strong>${p.nome}</strong><br>

R$ ${Number(p.preco).toFixed(2).replace(".",",")}
<br>

Bônus: ${Number(p.bonus).toFixed(2).replace(".",",")}%

<br>

<button class="editar"
onclick="editarProduto('${categoria}',${index})">
EDITAR
</button>

<button class="excluir"
onclick="excluirProduto('${categoria}',${index})">
EXCLUIR
</button>

`;

lista.appendChild(div);

});

});

}

</script>

</body>
</html>
