<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GES - Gerenciamento</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:#fff;
padding:20px;
}

.box{
max-width:700px;
margin:auto;
}

h1{
text-align:center;
margin-bottom:5px;
}

h2{
text-align:center;
font-size:18px;
margin-top:0;
color:#ccc;
}

input,select,textarea{
width:100%;
box-sizing:border-box;
padding:12px;
margin:6px 0 12px;
border-radius:6px;
border:1px solid #444;
background:#222;
color:#fff;
font-size:16px;
}

textarea{
min-height:80px;
resize:vertical;
}

button{
padding:12px 16px;
border:0;
border-radius:6px;
cursor:pointer;
font-weight:bold;
margin:4px 2px;
}

.salvar{
background:#19c37d;
color:#000;
}

.limpar{
background:#555;
color:#fff;
}

.editar{
background:#e5a500;
color:#000;
}

.excluir{
background:#d33;
color:#fff;
}

.sair{
background:#555;
color:#fff;
float:right;
}

.login{
max-width:400px;
margin:80px auto;
}

.login button{
width:100%;
background:#19c37d;
color:#000;
}

.formulario,.produtos{
background:#1b1b1b;
padding:18px;
border-radius:10px;
margin-top:20px;
}

.produto{
border:1px solid #444;
padding:15px;
margin-top:12px;
border-radius:8px;
}

.produto img{
width:120px;
height:90px;
object-fit:contain;
background:#222;
display:block;
margin-bottom:10px;
border-radius:5px;
}

.oculto{
display:none;
}

label{
font-weight:bold;
display:block;
margin-top:8px;
}
</style>
</head>

<body>

<div id="login" class="login">
<h1>GES</h1>
<h2>GERENCIAMENTO DE PRODUTOS</h2>

<input id="email" type="email" placeholder="E-mail">
<input id="senha" type="password" placeholder="Senha">

<button onclick="entrar()">ENTRAR</button>
</div>


<div id="painel" class="box oculto">

<button class="sair" onclick="sair()">SAIR</button>

<h1>GES</h1>
<h2>GERENCIAMENTO DE PRODUTOS</h2>

<div class="formulario">

<label>Categoria</label>
<select id="categoria">
<option value="cosmeticos">Cosméticos</option>
<option value="alimento">Alimento</option>
<option value="hidraulico">Hidráulico</option>
<option value="eletrons">Elétrons</option>
<option value="eletronico">Eletrônico</option>
<option value="construcao">Construção</option>
<option value="bairroquiz">Bairro Quiz</option>
<option value="eletricas">Elétricas</option>
</select>

<label>Nome do produto</label>
<input id="nome" placeholder="Nome do produto">

<label>Descrição</label>
<textarea id="descricao" placeholder="Descrição do produto"></textarea>

<label>Preço</label>
<input id="preco" type="number" step="0.01" placeholder="0,00">

<label>Bônus (%)</label>
<input id="bonus" type="number" step="0.01" placeholder="0">

<label>URL da imagem</label>
<input id="imagem" type="text" placeholder="https://...">

<button class="salvar" onclick="salvarProduto()">SALVAR PRODUTO</button>
<button class="limpar" onclick="limpar()">LIMPAR</button>

</div>


<div class="produtos">

<h2>PRODUTOS CADASTRADOS</h2>

<div id="lista"></div>

</div>

</div>


<script>

const defaultProducts={

cosmeticos:[
{
nome:"Perfume Premium GES",
descricao:"",
preco:150,
bonus:10,
imagem:""
}
],

alimento:[
{
nome:"Cesta de Alimentos Premium",
descricao:"",
preco:150,
bonus:15,
imagem:""
}
],

hidraulico:[
{
nome:"Torneira Luxo Inox",
descricao:"",
preco:120,
bonus:15,
imagem:""
}
],

eletrons:[
{
nome:"Kit Componentes Elétrons",
descricao:"",
preco:75,
bonus:15,
imagem:""
}
],

eletronico:[
{
nome:"DRONE V88 CÂMERA HD",
descricao:"",
preco:180,
bonus:15,
imagem:""
}
],

construcao:[
{
nome:"Argamassa Interna AC1",
descricao:"",
preco:28,
bonus:15,
imagem:""
}
],

bairroquiz:[
{
nome:"Produto Bairro Quiz",
descricao:"",
preco:50,
bonus:10,
imagem:""
}
],

eletricas:[
{
nome:"Produto Elétrico",
descricao:"",
preco:80,
bonus:10,
imagem:""
}
]

};


let produtos=
JSON.parse(localStorage.getItem("SAYSER_GES_PRODUCTS")) ||
defaultProducts;

let editando=null;


function salvarDados(){

localStorage.setItem(
"SAYSER_GES_PRODUCTS",
JSON.stringify(produtos)
);

}


function entrar(){

const email=document.getElementById("email").value;
const senha=document.getElementById("senha").value;

if(
email==="admin@sayser.com" &&
senha==="123456"
){

document.getElementById("login").classList.add("oculto");
document.getElementById("painel").classList.remove("oculto");

mostrarProdutos();

}else{

alert("E-mail ou senha incorretos.");

}

}


function sair(){

document.getElementById("painel").classList.add("oculto");
document.getElementById("login").classList.remove("oculto");

}


function salvarProduto(){

const categoria=document.getElementById("categoria").value;
const nome=document.getElementById("nome").value.trim();
const descricao=document.getElementById("descricao").value.trim();
const preco=parseFloat(document.getElementById("preco").value) || 0;
const bonus=parseFloat(document.getElementById("bonus").value) || 0;
const imagem=document.getElementById("imagem").value.trim();


if(!nome){

alert("Digite o nome do produto.");

return;

}


if(!produtos[categoria]){

produtos[categoria]=[];

}


const produto={
nome:nome,
descricao:descricao,
preco:preco,
bonus:bonus,
imagem:imagem
};


if(editando!==null){

produtos[editando.categoria][editando.index]=produto;

editando=null;

}else{

produtos[categoria].push(produto);

}


salvarDados();

limpar();

mostrarProdutos();

}


function editarProduto(categoria,index){

const p=produtos[categoria][index];

document.getElementById("categoria").value=categoria;
document.getElementById("nome").value=p.nome || "";
document.getElementById("descricao").value=p.descricao || "";
document.getElementById("preco").value=p.preco || "";
document.getElementById("bonus").value=p.bonus || "";
document.getElementById("imagem").value=p.imagem || "";

editando={
categoria:categoria,
index:index
};

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function excluirProduto(categoria,index){

if(confirm("Excluir este produto?")){

produtos[categoria].splice(index,1);

salvarDados();

mostrarProdutos();

}

}


function limpar(){

document.getElementById("nome").value="";
document.getElementById("descricao").value="";
document.getElementById("preco").value="";
document.getElementById("bonus").value="";
document.getElementById("imagem").value="";

editando=null;

}


function mostrarProdutos(){

const lista=document.getElementById("lista");

lista.innerHTML="";

Object.keys(produtos).forEach(categoria=>{

produtos[categoria].forEach((p,index)=>{

const div=document.createElement("div");

div.className="produto";

div.innerHTML=`

${
p.imagem
?
'<img src="'+p.imagem+'" onerror="this.style.display=\'none\'">'
:
''
}

<strong>${p.nome}</strong>

<br>

${p.descricao || ""}

<br><br>

Preço: R$ ${Number(p.preco).toFixed(2).replace(".",",")}

<br>

Bônus: ${Number(p.bonus).toFixed(2).replace(".",",")}% 

<br><br>

<button class="editar"
onclick="editarProduto('${categoria}',${index})">
EDITAR
</button>

<button class="excluir"
onclick="excluirProduto('${categoria}',${index})">
EXCLUIR
</button>

`;

lista.appendChild(div);

});

});

}


if(!localStorage.getItem("SAYSER_GES_PRODUCTS")){

salvarDados();

}

</script>

</body>
</html>
